<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Registro de jornada laboral y descansos del personal.">
	<title>Control de jornada</title>
	<link rel="stylesheet" href="../css/main.css">
	<link rel="stylesheet" href="../css/layout.css">
	<link rel="stylesheet" href="../css/components/forms.css">
	<link rel="stylesheet" href="../css/components/buttons.css">
</head>
<body>
	<header class="app-header">
		<a class="app-brand" href="./index.html" aria-label="Control de jornada, inicio">
			<span class="app-brand__mark" aria-hidden="true">CJ</span>
			<span>Control de jornada</span>
		</a>
	</header>

	<main class="page-content">
		<section class="page-heading" aria-labelledby="page-title">
			<div>
				<p class="eyebrow">Registro diario</p>
				<h1 id="page-title">Jornada laboral</h1>
				<p>Registra tu entrada, descansos y salida.</p>
			</div>
			<p class="workday-date" id="workday-date">Fecha de hoy</p>
		</section>

		<div class="workday-layout">
			<section class="panel employee-panel" aria-labelledby="employee-title">
				<div class="panel-heading">
					<p class="eyebrow">Empleado</p>
					<h2 id="employee-title">Identificación</h2>
				</div>

				<form id="employee-form">
					<div class="form-field">
						<label for="employee-name">Nombre completo</label>
						<input
							id="employee-name"
							name="employeeName"
							type="text"
							autocomplete="name"
							maxlength="100"
							placeholder="Ej. María García"
							required
						>
					</div>

					<div class="form-field">
						<label for="employee-type">Tipo de empleado</label>
						<select id="employee-type" name="employeeType" required>
							<option value="" selected disabled>Selecciona una opción</option>
							<option value="permanent">Permanente</option>
							<option value="temporary">Temporal</option>
						</select>
					</div>

					<button class="button button--primary" id="clock-in-button" type="submit">
						Registrar entrada
					</button>
				</form>
			</section>

			<section class="panel time-panel" aria-labelledby="time-title">
				<div class="panel-heading">
					<p class="eyebrow">Mi registro</p>
					<h2 id="time-title">Marcas de hoy</h2>
				</div>

				<dl class="time-records">
					<div class="time-record">
						<dt>Entrada</dt>
						<dd id="clock-in-time">--:--</dd>
					</div>
					<div class="time-record">
						<dt>Inicio de descanso</dt>
						<dd id="break-start-time">--:--</dd>
					</div>
					<div class="time-record">
						<dt>Fin de descanso</dt>
						<dd id="break-end-time">--:--</dd>
					</div>
					<div class="time-record">
						<dt>Salida</dt>
						<dd id="clock-out-time">--:--</dd>
					</div>
				</dl>

				<div class="break-summary">
					<span>Tiempo de descanso</span>
					<output id="break-duration" aria-live="polite">--</output>
				</div>

				<div class="time-actions" aria-label="Acciones de jornada">
					<button class="button" id="break-start-button" type="button" disabled>
						Iniciar descanso
					</button>
					<button class="button" id="break-end-button" type="button" disabled>
						Finalizar descanso
					</button>
					<button class="button button--danger" id="clock-out-button" type="button" disabled>
						Registrar salida
					</button>
				</div>
			</section>
		</div>

		<p class="status-message" id="status-message" role="status" aria-live="polite"></p>
	</main>

	<script type="module" src="../js/app.js"></script>
</body>
</html>
